# Staging on Coolify (the lab's R610): app door-api-staging, branch `staging`,
# auto-deploys on every push to that branch. LAN, Ops VPN and tailnet only:
#   door-api   http://172.22.110.200:3001  (docs at /docs, health at /health)
#   board      http://172.22.110.200:9099  (the board's HTTP protocol)
#   control    the emulator's control API, 127.0.0.1:9199 on the R610 only
# How staging and production deploy, and how to ship a change: README.md,
# "Staging and production".
#
# Since the door cutover, staging never talks to the real board: production
# door-api is the board's only client, on its own segment. Staging's one
# controller, `front`, is the board's real compiled firmware running under
# simavr (sim/avr), so everything members staging does (doors, cards, the log
# import, the alarm) behaves exactly as on the board, with nothing at stake.
#
# The emulator's password is the firmware default 1234: it guards nothing. It is
# built from heatsynclabs/door-controller-platformio at FIRMWARE_REF.
# DOOR_JOBS stays "off" (literal here): staging must never be able to run jobs
# against a real board, should one ever be added to this list.
#
# Values in ${...} come from the Coolify resource's environment variables.
services:
  door-api:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      - door-sim
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      DOOR_JOBS: "off"
      API_KEYS: ${API_KEYS}
      CONTROLLER_PASSWORD_FRONT: "1234"
      CONTROLLERS_JSON: '[{"id":"front","driver":"openaccess","url":"http://door-sim:80","doors":[1,2],"sandbox":true}]'
      JOURNAL_DIR: /data/journal
      AUDIT_FILE: /data/audit/door-actions.log
    volumes:
      - door-api-staging-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  door-sim:
    build:
      context: ./sim/avr
      args:
        PASSWORD: "0x1234"
    restart: unless-stopped
    ports:
      - "9099:80"
      - "127.0.0.1:9199:9199"
    environment:
      TZ: America/Phoenix
      EEPROM_FILE: /data/eeprom.bin
    volumes:
      - door-sim-eeprom:/data

volumes:
  door-api-staging-data:
  door-sim-eeprom:
