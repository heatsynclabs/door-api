# Staging on Coolify (the lab's R610): app door-api-staging, branch `staging`,
# auto-deploys on every push to that branch. LAN, Ops VPN and tailnet only:
#   door-api   http://172.22.110.200:3001  (docs at /docs, health at /health)
#   simulator  http://172.22.110.200:9099  (a fake Open Access board; /sim/*)
#
# The members staging site (members repo, docker-compose.staging.yml) sends its
# door and card actions here with DOOR_API_URL and DOOR_API_KEY.
#
# DOOR_JOBS is "off", written in this file so it cannot be switched on from
# Coolify: event log reads, whole-table card sync and health polling only work
# on sandbox controllers, so this copy can never repeat production's door jobs.
#
# The controller list is in this file on purpose. Staging drives the simulator.
# Pointing it at real hardware is a reviewed commit here, never a quick edit in
# a dashboard, and must not be the production board (172.22.110.99) while
# production members still drives it.
#
# Values in ${...} come from the Coolify resource's environment variables.
services:
  door-api:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      - door-sim
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      DOOR_JOBS: "off"
      API_KEYS: ${API_KEYS}
      CONTROLLERS_JSON: '[{"id":"front","driver":"openaccess","url":"http://door-sim:9099","password":"${SIM_PASSWORD}","doors":[1,2],"sandbox":true}]'
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  door-sim:
    build:
      context: ./sim
    restart: unless-stopped
    ports:
      - "9099:9099"
    environment:
      PORT: "9099"
      PASSWORD: ${SIM_PASSWORD}
